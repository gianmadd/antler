name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # the Linux and Windows branches of antler-host/antler-server are written on a Mac: keep them compiling
  server-check:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo check -p antler-server --target ${{ matrix.target }}

  # the app on Windows (#40): the whole test suite, then a release check, which runs gpui-pre-windows' build
  # script (only release builds compile the HLSL shaders, with the Windows SDK's fxc.exe; debug ones do it at run time)
  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-app-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-app-windows-
      - run: cargo test --workspace
      - run: cargo check --release -p antler
