name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and upload the zip as an artifact only; no release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "${GITHUB_REF_NAME}" != "v$version" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Metal Toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Bundle
        run: scripts/bundle.sh --zip

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: antler-zip
          path: target/bundle/Antler-*-arm64.zip

  # antler-server for every host the app can reach (docs/agents/remote.md); asset names follow src/ssh.rs
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, os: linux, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, os: linux, arch: aarch64 }
          - { runner: macos-latest, target: aarch64-apple-darwin, os: macos, arch: aarch64 }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, os: macos, arch: x86_64 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, os: windows, arch: x86_64, ext: .exe }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, os: windows, arch: aarch64, ext: .exe }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable

      - name: musl-tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-server-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: |
          cargo build --profile server -p antler-server --target ${{ matrix.target }}
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          cp "target/${{ matrix.target }}/server/antler-server${{ matrix.ext }}" \
            "dist/antler-server-$version-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: antler-server-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  # one job creates the release, so it exists once with the zip and every server asset
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --generate-notes
