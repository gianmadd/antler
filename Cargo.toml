[package]
name = "antler"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "A lightweight macOS editor that shows every git repository under a folder in one panel"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gianmadd/antler"

[workspace]
members = [".", "crates/antler-host", "crates/antler-server"]

[dependencies]
antler-host = { path = "crates/antler-host" }
gpui-kit = { version = "=0.8.1", features = [
    # every grammar of "tree-sitter-languages" except sql: tree-sitter-sequel pins cc ~1.2, which conflicts with the locked cc
    "tree-sitter-astro", "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cmake", "tree-sitter-cpp", "tree-sitter-csharp", "tree-sitter-css", "tree-sitter-diff", "tree-sitter-ejs", "tree-sitter-elixir", "tree-sitter-erb", "tree-sitter-go", "tree-sitter-graphql", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-jsdoc", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-make", "tree-sitter-markdown", "tree-sitter-php", "tree-sitter-proto", "tree-sitter-python", "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-scala", "tree-sitter-svelte", "tree-sitter-swift", "tree-sitter-toml", "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml", "tree-sitter-zig",
] }
async-channel = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rust-embed = "8.13.0"
# already built for gpui's img(): an image's pixel size for the status bar
image = { version = "0.25", default-features = false }
usvg = { version = "0.46", default-features = false }
# already built for gpui-component: the diff of text being typed, no git process per keystroke
similar = "2.7"
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2", "deflate-flate2-zlib-rs"] }
flate2 = "1.1.10"

[dev-dependencies]
tempfile = "3.27.0"
# the real macOS text system, to prove a font registers and has its glyphs
gpui-pre = "=0.3.10"
gpui-pre-apple = "=0.3.10"
# the model tests must not touch the real Trash
antler-host = { path = "crates/antler-host", features = ["test-trash"] }

[profile.release]
strip = true

# antler-server only (`cargo build --profile server -p antler-server`): small static binary; the app keeps `release`
[profile.server]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
