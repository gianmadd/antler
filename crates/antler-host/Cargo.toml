[package]
name = "antler-host"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Antler's file and git layer (Host), its protocol and the remote client and server; no UI, builds on Linux, macOS and Windows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gianmadd/antler"

[features]
# `Local::trash` moves into the temp folder instead of the Trash, for the model tests
test-trash = []

[dependencies]
notify = "8.2.1"
grep = "0.4.1"
ignore = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Explorer's Delete: NSFileManager trashItemAtURL (already in the tree through gpui)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3.27.0"
